[pytest]
filterwarnings =
    ignore:You should not use the 'timeout' argument with the TestClient
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The anyio.abc.BlockingPortal alias is deprecated
# A test that runs longer than this fails with the stack of every thread printed,
# so a hang in CI shows exactly where it is stuck instead of running until cancelled.
timeout = 120
timeout_method = thread
